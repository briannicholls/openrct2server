name: openrct2

services:
  server:
    container_name: openrct2-server
    image: openrct2/openrct2-cli:0.5.5@sha256:d516dc3784b863ac24225457f33e29f9cfbb98e408d22725a0f742720792eac3
    platform: linux/amd64
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /data
    init: true
    restart: unless-stopped
    environment:
      OPENRCT2_NO_REPL: "1"
    command:
      - host
      - /data/save/${PARK_FILE:-server.park}
      - --port=11753
      - --address=0.0.0.0
      - --user-data-path=/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:11753:11753/tcp"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${MEMORY_LIMIT:-1g}
    cpus: ${CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '>/dev/tcp/127.0.0.1/11753'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
